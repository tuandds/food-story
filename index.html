<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Food Story</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Lilita+One&display=swap" rel="stylesheet">
<style>body { visibility: hidden; background: #2a1a10; }</style>
<script>
// GitHub Pages lets browsers cache files for 10 minutes. version.txt is always fetched
// fresh and its value is appended to style.css / game.js, so an update shows up on the
// next reload. The game script starts only after the stylesheet has loaded.
(function () {
  function boot(v) {
    var css = document.createElement('link');
    css.rel = 'stylesheet';
    css.href = 'style.css?v=' + v;
    css.onload = css.onerror = function () {
      var start = function () {
        document.body.style.visibility = 'visible';
        var js = document.createElement('script');
        js.src = 'game.js?v=' + v;
        document.body.appendChild(js);
      };
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
      else start();
    };
    document.head.appendChild(css);
  }
  fetch('version.txt', { cache: 'no-store' })
    .then(function (r) { return r.ok ? r.text() : Promise.reject(); })
    .then(function (t) { boot(encodeURIComponent(t.trim())); })
    .catch(function () { boot(Date.now()); });
})();
</script>
</head>
<body>
<div id="game">
  <div id="queue-row"></div>
  <div id="customers"></div>
  <div id="curtain"></div>
  <div id="title"><div id="lvl">Level 1</div></div>
  <button id="btn-settings" title="Cài đặt"><img src="assets/ui/setting.png" alt="Cài đặt"></button>
  <div id="qbox"><img src="assets/cust/0.png" alt=""><span id="qcount">0</span></div>

  <div id="belt"><div id="belt-count">0/7</div></div>
  <div id="table"></div>

  <div id="boosters">
    <button class="booster" data-b="hint"><img src="assets/ui/pu_hint.png" alt=""><span class="cnt"></span><label>Gợi ý</label></button>
    <button class="booster" data-b="shuffle"><img src="assets/ui/pu_shuffle.png" alt=""><span class="cnt"></span><label>Xáo trộn</label></button>
    <button class="booster" data-b="slot"><img src="assets/ui/pu_xtr_slot.png" alt=""><span class="cnt"></span><label>+1 Ô</label></button>
  </div>

  <div id="layer"></div>
  <div id="overlay" class="hidden">
    <div class="card">
      <img class="rays" src="assets/ui/rays.png" alt="">
      <img class="flags" src="assets/ui/flags.png" alt="">
      <img class="title-img" alt="">
      <div class="title-txt"></div>
      <img class="star" src="assets/ui/star.png" alt="">
      <p class="msg"></p>
      <div class="level-pick">
        <div class="lp-label">Chọn level</div>
        <div class="lp-grid" id="lv-grid"></div>
      </div>
      <button class="big-btn" id="btn-next"></button>
      <button class="big-btn alt" id="btn-alt"></button>
    </div>
  </div>
  <div id="toast"></div>
</div>
</body>
</html>
